
name: Deploy HRIDYAM-AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: cardiac-risk-project/heart-viewer
        run: npm install

      - name: Build website
        working-directory: cardiac-risk-project/heart-viewer
        run: npm run build -- --base=/hridyam-ai/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: cardiac-risk-project/heart-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
